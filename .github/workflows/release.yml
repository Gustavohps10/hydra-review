name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: "chore: release packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Release Needed
        id: check_tag
        run: |
          git fetch --tags --force
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG já existe. Nenhuma nova release necessária."
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG não existe. Nova release necessária!"
          fi

      - name: Build Assets & Extract Release Notes
        if: steps.changesets.outputs.published == 'true' || steps.check_tag.outputs.tag_exists == 'false'
        id: release_info
        run: |
          npm run release
          npx tsx scripts/extract-release-notes.ts

      - name: Create GitHub Release and Upload Assets
        if: steps.changesets.outputs.published == 'true' || steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          name: ${{ steps.check_tag.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          files: |
            .output/*.zip
            .output/*.exe
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
